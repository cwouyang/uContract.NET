name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Least privilege for GITHUB_TOKEN: this workflow only checks out and builds.
# Declared here rather than relying on the repository-level default, which can
# be widened in Settings without any change landing in version control.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Check formatting (CSharpier)
        run: dotnet csharpier check .

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --no-build --verbosity normal
