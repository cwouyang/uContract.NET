name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Least privilege for GITHUB_TOKEN: this workflow only checks out and builds.
# Declared here rather than relying on the repository-level default, which can
# be widened in Settings without any change landing in version control.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Resolve the SDK from global.json so CI cannot drift from it.
          # global.json (8.0.427 / latestPatch) accepts the 8.0.4xx band from 8.0.427, the
          # first patched SDK (ILCompiler 8.0.33). A floating
          # 'dotnet-version: 8.0.x' once resolved to a band global.json rejected, so builds
          # silently relied on the runner image happening to preinstall a matching SDK.
          global-json-file: global.json
          # Installed only so the net8.0 tests can also run on the .NET 10 runtime (#84);
          # global.json still selects the SDK.
          dotnet-version: 10.0.x

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Check formatting (CSharpier)
        run: dotnet csharpier check .

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: List installed .NET runtimes
        run: dotnet --list-runtimes

      # The net8.0 tests roll forward to the .NET 10 runtime; some tests are gated on the
      # runtime version, so the .NET 10 group only runs here (#84).
      - name: Test on the .NET 10 runtime
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: dotnet test --no-build --verbosity normal

      # The package ships the Release build; test that configuration too.
      - name: Build (Release)
        run: dotnet build -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test (Release)
        run: dotnet test -c Release --no-build --verbosity normal

      # Old<T>() and EnsureAssignable<T>() behave differently under Native AOT; unit tests cannot see it.
      - name: Publish Native AOT smoke test
        if: runner.os == 'Linux'
        run: dotnet publish tests/uContract.AotSmoke/uContract.AotSmoke.csproj -c Release -r linux-x64 -warnaserror -o "${{ runner.temp }}/aot-smoke"

      - name: Run Native AOT smoke test
        if: runner.os == 'Linux'
        run: "${{ runner.temp }}/aot-smoke/uContract.AotSmoke --assert"

      - name: Run Native AOT smoke test (DBC_POST=off)
        if: runner.os == 'Linux'
        env:
          DBC_POST: "off"
        run: "${{ runner.temp }}/aot-smoke/uContract.AotSmoke --assert"
