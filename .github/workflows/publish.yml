name: Publish to NuGet

on:
  release:
    types: [published]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Resolve the SDK from global.json so CI cannot drift from it.
          # global.json (8.0.427 / latestPatch) accepts the 8.0.4xx band from 8.0.427, the
          # first patched SDK (ILCompiler 8.0.33). A floating
          # 'dotnet-version: 8.0.x' once resolved to a band global.json rejected, so builds
          # silently relied on the runner image happening to preinstall a matching SDK.
          global-json-file: global.json
          # Installed only so the net8.0 tests can also run on the .NET 10 runtime (#84);
          # global.json still selects the SDK.
          dotnet-version: 10.0.x

      - name: Validate version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION=$(grep -oP '<Version>\K[^<]+' src/uContract/uContract.csproj)
          echo "Tag version: $TAG_VERSION"
          echo "Csproj version: $CSPROJ_VERSION"
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match csproj version ($CSPROJ_VERSION)"
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test -c Release --verbosity normal

      # The net8.0 tests roll forward to the .NET 10 runtime; some tests are gated on the
      # runtime version, so the .NET 10 group only runs here (#84). The Test step above
      # built Release.
      - name: Test on the .NET 10 runtime
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/uContract/uContract.csproj -c Release --no-restore -o ./nupkg

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ./nupkg/
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: build-and-validate
    environment: nuget

    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: ./nupkg/

      - name: Push to NuGet
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./nupkg/*.nupkg --clobber
